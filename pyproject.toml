[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "kmacsolves"
dynamic = ["version"]
description = ""
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Kincaid MacDonald", email = "kincaid@wherewith.ai"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/professorwug/kmacsolves"
Documentation = "https://professorwug.github.io/kmacsolves/"

[project.entry-points.nbdev]
kmacsolves = "kmacsolves._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "kmacsolves.__version__"}

[tool.setuptools.packages.find]
include = ["kmacsolves"]

[tool.nbdev]
